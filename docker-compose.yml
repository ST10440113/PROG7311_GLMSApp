
services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "TeruleDeis83@@"
      ACCEPT_EULA: "Y"
    ports:
      - "1434:1433"
    volumes:
      - sql-data:/var/opt/mssql 
    networks:
      - glms-network

  glms-backend-api:
    image: ${DOCKER_REGISTRY-}apitechmove
    build:
      context: .
      dockerfile: API_Techmove/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=PROG7311_GLMSAppContext-97bb6685-41cb-4d76-b4e9-f734a25cec79;User Id=sa;Password=TeruleDeis83@@;TrustServerCertificate=True
    depends_on:
      - sql-server-db
    networks:
      - glms-network

  glms-frontend-web:
    image: ${DOCKER_REGISTRY-}prog7311glmsapp
    build:
      context: .
      dockerfile: PROG7311_GLMSApp/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ApiUrl=http://glms-backend-api:8080/
    depends_on:
      - glms-backend-api
    networks:
      - glms-network

networks:
  glms-network:
    driver: bridge

volumes:
  sql-data: